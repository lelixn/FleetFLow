spring.application.name=routeforge

server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=false

app.seed.enabled=${APP_SEED_ENABLED:false}

jwt.secret=${JWT_SECRET:VGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgSlRXIGdlbmVyYXRpb24uIE5vIG9uZSBzaG91bGQgYmUgYWJsZSB0byBndWVzcyB0aGlzIGtleSE=}
jwt.expiration=${JWT_EXPIRATION:86400000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized